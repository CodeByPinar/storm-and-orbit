<title>Fırtına ve Yörünge Simülatörü</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Düzen: tam ekran 3B stüdyo; üstte başlık ve bölüm hapları, solda bölüm listesi ve anlatı kartı,
     sağda canlı harita ve telemetri, altta veri paneli ve oynatma çubuğu. Tek, bilinçli aydınlık görünüm. */
  :root {
    color-scheme: light;
    --bg: #f6f5fa;
    --ink: #17141f;
    --ink-2: #4f4a5e;
    --muted: #8b869a;
    --line: #e3dfee;
    --card: rgba(255, 255, 255, 0.86);
    --violet: #8a4dff;
    --violet-ink: #6a2cf0;
    --violet-soft: #efe7ff;
    --warn: #b4520a;
    --display: "Inter Tight", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --gl: max(16px, env(safe-area-inset-left, 0px));
    --gr: max(16px, env(safe-area-inset-right, 0px));
    --gt: calc(env(safe-area-inset-top, 0px) + 16px);
    --gb: calc(env(safe-area-inset-bottom, 0px) + 14px);
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); }
  body { overflow: hidden; font-family: var(--display); }
  #sim { position: fixed; inset: 0; background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #gl:active { cursor: grabbing; }
  .ui { position: absolute; z-index: 3; }
  .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  button { font-family: var(--display); }
  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible, .track:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .brand { top: var(--gt); left: var(--gl); display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .brand span { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .topright { top: var(--gt); right: var(--gr); display: flex; gap: 8px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--ink); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; }
  button.pill { cursor: pointer; }
  button.pill:hover { border-color: #cbbef0; }
  button.pill[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill svg { width: 14px; height: 14px; }
  .seg { display: inline-flex; height: 30px; padding: 2px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-sizing: border-box; }
  .seg button { all: unset; cursor: pointer; padding: 0 10px; border-radius: 999px; font: 600 11.5px var(--display); color: var(--ink-2); display: inline-flex; align-items: center; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--violet); outline-offset: 1px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--violet); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(138, 77, 255, .5); } 70% { box-shadow: 0 0 0 7px rgba(138, 77, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(138, 77, 255, 0); } }

  .head { top: var(--gt); left: 50%; transform: translateX(-50%); text-align: center; width: min(760px, 52vw); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .head .model { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--violet-ink); text-transform: uppercase; }
  .head h1 { margin: 0; font-size: clamp(22px, 2.4vw, 34px); font-weight: 600; letter-spacing: -.025em; line-height: 1.08; text-wrap: balance; }
  .head .date { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 6px; pointer-events: auto; }
  .chip { height: 26px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font: 500 11.5px var(--display); color: var(--ink-2); cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background .25s, color .25s, border-color .25s; }
  .chip:hover { border-color: #cbbef0; color: var(--ink); }
  .chip[aria-current="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  .nav { top: calc(var(--gt) + 64px); left: var(--gl); width: 214px; display: flex; flex-direction: column; gap: 2px; }
  .nav .lbl { margin: 0 0 6px 10px; }
  .nav button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; padding: 7px 10px; border-radius: 10px; transition: background .25s; }
  .nav button:hover { background: rgba(255, 255, 255, .7); }
  .nav button:focus-visible { outline: 2px solid var(--violet); }
  .nav .n { font-family: var(--mono); font-size: 10.5px; color: var(--muted); padding-top: 2px; grid-row: span 2; }
  .nav .t { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .nav .s { font-size: 11.5px; color: var(--muted); }
  .nav .bar { grid-column: 2; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; display: none; }
  .nav .bar i { display: block; height: 100%; width: 0; background: var(--violet); }
  .nav button[aria-current="true"] { background: var(--card); box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(60, 30, 120, .06); }
  .nav button[aria-current="true"] .t { color: var(--ink); }
  .nav button[aria-current="true"] .n { color: var(--violet-ink); }
  .nav button[aria-current="true"] .bar { display: block; }

  .story { left: var(--gl); bottom: calc(var(--gb) + 58px); width: min(380px, 30vw); max-height: calc(100% - 330px); overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 30px rgba(60, 30, 120, .07); scrollbar-width: thin; }
  .story h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; text-wrap: balance; }
  .story p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .story .big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .story .big b { font-size: 34px; font-weight: 600; letter-spacing: -.03em; color: var(--violet-ink); font-variant-numeric: tabular-nums; }
  .story .big span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .story ul { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
  .story details { border-top: 1px solid var(--line); padding-top: 8px; }
  .story summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--violet-ink); list-style: none; display: flex; align-items: center; gap: 6px; }
  .story summary::-webkit-details-marker { display: none; }
  .story summary::before { content: "+"; font-family: var(--mono); width: 14px; text-align: center; }
  .story details[open] summary::before { content: "−"; }
  .story details ul { margin-top: 6px; }
  .fadein { animation: fin .5s ease both; }
  @keyframes fin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .tele { top: calc(var(--gt) + 64px); right: var(--gr); width: 236px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card .v { font-size: 20px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .card .sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .card svg { width: 100%; height: 30px; display: block; overflow: visible; }
  .q { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--line); font: 600 9.5px var(--display); color: var(--violet-ink); margin-left: 4px; vertical-align: 1px; background: #fff; }
  .q:hover { border-color: var(--violet); }
  .q:focus-visible { outline: 2px solid var(--violet); }
  .meter { height: 5px; border-radius: 3px; background: var(--violet-soft); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--violet); border-radius: 3px; }
  .bands { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 8px; align-items: center; }
  .bands span { font-family: var(--mono); color: var(--ink-2); font-size: 10.5px; }
  .bands b { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 11.5px; text-align: right; }
  .mapcard canvas { width: 100%; aspect-ratio: 2 / 1; display: block; border-radius: 8px; background: #d9d3ec; }
  .maplegend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
  .maplegend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  .chart, .lab { left: 50%; transform: translateX(-50%); bottom: calc(var(--gb) + 58px); width: min(560px, calc(100vw - 2 * 264px - 40px)); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 10px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(60, 30, 120, .07); display: flex; flex-direction: column; gap: 6px; }
  .chart .ch-head, .lab .ch-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chart h3, .lab h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .chart .seg, .lab .seg { height: 24px; }
  .chart .seg button, .lab .seg button { font-size: 10.5px; padding: 0 8px; }
  .chart .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--ink-2); }
  .chart .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .chart .plot { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart svg text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  .chart .note, .lab .note { font-size: 10.5px; color: var(--muted); }
  .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 11px; line-height: 1.45; box-shadow: 0 6px 16px rgba(60, 30, 120, .1); white-space: nowrap; font-variant-numeric: tabular-nums; z-index: 2; }
  .tip b { display: block; font-size: 11.5px; }
  .tip span { display: block; color: var(--ink-2); font-family: var(--mono); font-size: 10px; }

  .lab .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .lab .presets button { all: unset; cursor: pointer; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; background: #fff; color: var(--ink-2); }
  .lab .presets button[aria-pressed="true"] { border-color: var(--violet); color: var(--violet-ink); background: var(--violet-soft); }
  .lab .presets button:focus-visible { outline: 2px solid var(--violet); }
  .lab .sl { display: grid; grid-template-columns: 150px 1fr 64px; align-items: center; gap: 10px; font-size: 11.5px; color: var(--ink-2); }
  .lab .sl b { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
  .lab input[type="range"] { width: 100%; accent-color: var(--violet); }
  .lab .out { display: grid; grid-template-columns: auto 1fr auto auto; gap: 5px 10px; align-items: center; font-size: 11.5px; }
  .lab .out span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); }
  .lab .out b { font-variant-numeric: tabular-nums; text-align: right; }
  .lab .out em { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-align: right; }
  .lab .warn { font-size: 11px; color: var(--warn); }
  .lab .cmp { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .status { left: var(--gl); right: var(--gr); bottom: var(--gb); display: grid; grid-template-columns: auto auto 1fr auto auto auto; align-items: center; gap: 12px; height: 42px; padding: 0 8px 0 6px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .iconbtn { all: unset; box-sizing: border-box; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; }
  .iconbtn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
  .iconbtn svg { width: 14px; height: 14px; }
  .iconbtn:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .status .now { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .status .now span { color: var(--muted); font-weight: 500; font-family: var(--mono); font-size: 11px; margin-left: 6px; }
  .track { position: relative; height: 22px; cursor: pointer; }
  .track .rail { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line); border-radius: 2px; }
  .track .fill { position: absolute; left: 0; top: 10px; height: 2px; background: var(--violet); border-radius: 2px; width: 0; }
  .track .tick { position: absolute; top: 6px; width: 1px; height: 10px; background: #cfc9de; }
  .track .head-dot { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; border: 2px solid var(--violet); box-sizing: border-box; }
  .status .tc { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sel { height: 28px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font: 500 11.5px var(--display); color: var(--ink); padding: 0 10px; cursor: pointer; }

  #leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: visible; }
  .callout { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; box-shadow: 0 6px 16px rgba(60, 30, 120, .08); white-space: nowrap; transition: opacity .25s; }
  .callout b { display: block; font-size: 12px; font-weight: 600; }
  .callout span { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .pick { z-index: 6; left: 0; top: 0; width: 248px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: 0 14px 34px rgba(60, 30, 120, .14); display: flex; flex-direction: column; gap: 6px; }
  .pick .ph { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  .pick h4 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .pick p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
  .pick dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11.5px; }
  .pick dt { color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
  .pick dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .pick .x { all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .pick .x:hover { background: var(--violet-soft); color: var(--ink); }
  .pick .x:focus-visible { outline: 2px solid var(--violet); }
  .pick .foot { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
  .hint { right: calc(var(--gr) + 252px); bottom: calc(var(--gb) + 52px); font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; line-height: 1.6; pointer-events: none; }
  #fade { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; z-index: 1; }

  .drawer { position: absolute; z-index: 15; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: #fff; border-left: 1px solid var(--line); box-shadow: -20px 0 50px rgba(60, 30, 120, .12); overflow-y: auto; padding-block: calc(var(--gt) + 4px) 32px; padding-left: 24px; padding-right: max(20px, env(safe-area-inset-right, 0px)); box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; user-select: text; -webkit-user-select: text; }
  .drawer .dh { display: flex; justify-content: space-between; align-items: center; position: sticky; top: calc(-1 * var(--gt)); background: #fff; padding-block: 6px; }
  .drawer h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
  .drawer h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .drawer p, .drawer li { font-size: 13px; line-height: 1.6; color: var(--ink-2); margin: 0; }
  .drawer ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .drawer dl { margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .drawer dt { font-size: 13px; font-weight: 600; color: var(--ink); }
  .drawer dd { margin: 2px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
  .drawer .hl { background: var(--violet-soft); border-radius: 8px; padding: 6px 8px; margin: -6px -8px; transition: background 1.2s; }
  .drawer a { color: var(--violet-ink); }
  .drawer kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: #faf9fd; }
  .drawer .dnav { display: flex; flex-wrap: wrap; gap: 6px; }
  .drawer .dnav button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 11.5px; color: var(--ink-2); }
  .drawer .dnav button:hover { border-color: var(--violet); color: var(--violet-ink); }
  .drawer .dnav button:focus-visible { outline: 2px solid var(--violet); }
  .drawer section { scroll-margin-top: 60px; }
  .drawer .tw { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .drawer table { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
  .drawer th { position: sticky; top: 0; background: #faf9fd; text-align: right; font-weight: 600; padding: 6px 5px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .drawer th:first-child, .drawer td:first-child { text-align: left; }
  .drawer th button { all: unset; cursor: pointer; }
  .drawer th button:focus-visible { outline: 2px solid var(--violet); }
  .drawer th[aria-sort="ascending"] button::after { content: " ↑"; color: var(--violet-ink); }
  .drawer th[aria-sort="descending"] button::after { content: " ↓"; color: var(--violet-ink); }
  .drawer td { padding: 4px 5px; border-bottom: 1px solid #f1eef7; text-align: right; color: var(--ink-2); white-space: nowrap; }
  .drawer tr.click { cursor: pointer; }
  .drawer tr.click:hover td { background: var(--violet-soft); color: var(--ink); }
  .drawer td .bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--violet); vertical-align: 1px; margin-right: 5px; }
  .drawer td .bar.neg { background: #c9c2dc; }
  .drawer .cap { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .drawer .tl { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; border-left: 2px solid var(--violet-soft); }
  .drawer .tl li { padding-left: 14px; position: relative; }
  .drawer .tl li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid var(--violet); box-sizing: border-box; }
  .drawer .tl b { display: block; color: var(--ink); font-size: 13px; }
  .drawer .tl span { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--violet-ink); margin: 1px 0 3px; }
  .drawer details { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .drawer details + details { margin-top: 8px; }
  .drawer summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink); }
  .drawer details p { margin-top: 6px; }
  .drawer .eq { font-family: var(--mono); font-size: 13px; background: #faf9fd; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink); margin: 8px 0; }
  .story .look { font-size: 12px; color: var(--ink-2); background: var(--violet-soft); border-radius: 8px; padding: 6px 9px; line-height: 1.5; }

  sec("fizik", L("Fizik: fırtına bir uyduyu nasıl alçaltır?", "Physics: how does a storm lower a satellite?"),
    det(L("1 · Güneş'ten Dünya'ya", "1 · From the Sun to Earth"), L("Güneş patlamaları ve koronal kütle atımları (CME) yüklü parçacık bulutları fırlatır. Bir CME Dünya'ya genellikle 1–3 günde ulaşır. Bulutun manyetik alanı Dünya'nınkiyle ters yönlüyse alanlar birleşir ve enerji manyetosfere akar: jeomanyetik fırtına başlar.", "Solar flares and coronal mass ejections (CMEs) throw out clouds of charged particles. A CME usually reaches Earth in 1–3 days. If the cloud's magnetic field points opposite to Earth's, the fields connect and energy pours into the magnetosphere: a geomagnetic storm begins.")),
    det(L("2 · Kutuplarda ısınma", "2 · Heating at the poles"), L("Enerji kutup bölgelerinde elektrik akımları olarak üst atmosfere iner ve sürtünmeyle ısıya dönüşür (Joule ısınması). Kutup ışıkları bu sürecin görünen yüzüdür. Isınan gaz genişler ve küresel rüzgârlarla ekvatora doğru yayılır.", "The energy comes down into the upper atmosphere over the poles as electric currents and turns into heat (Joule heating). Auroras are the visible side of this. The heated gas expands and spreads toward the equator with global winds.")),
    det(L("3 · Termosfer şişer", "3 · The thermosphere swells"), L("Yoğunluk yükseklikle üstel azalır:", "Density falls exponentially with height:"), eq("ρ(h) ≈ ρ₀ · e^(−h / H)"),
      L("H, ölçek yüksekliğidir ve sıcaklıkla orantılıdır. Atmosfer ısınınca H büyür; sabit bir irtifadaki yoğunluk birkaç kat artabilir. Etki yükseldikçe büyür, çünkü üstel terim irtifa ile çarpılır. Bu, irtifa bölümündeki bulgunun fiziksel açıklaması.", "H is the scale height and grows with temperature. When the atmosphere heats, H grows and density at a fixed altitude can rise several-fold. The effect grows with altitude, because the exponent scales with height. This is the physics behind the altitude chapter.")),

function seekTo(t, smooth) { if (LAB.on) setLab(false); held = false; simT = wrapT(t); if (smooth && !CAPTURE) startBlend(); if (CAM.mode === "free" && smooth) CAM.mode = "auto"; AUD.resync(simT); setPlayUI(); if (!playing || CAPTURE) frame(simT); }
function gotoChapter(i) { seekTo((((i % NCH) + NCH) % NCH) * CHD + 0.01, true); }
function setPlaying(p) { if (p && LAB.on) setLab(false); playing = p; if (p) held = false; setPlayUI(); if (!p) AUD.stopAll(); else AUD.resync(simT); }
function togglePlay() { if (held) { gotoChapter(Math.floor(simT / CHD) + 1); setPlaying(true); } else setPlaying(!playing); }
btnPlay.addEventListener("click", togglePlay);
btnSound.addEventListener("click", async () => { await AUD.toggle(simT); setSoundUI(); });
let scrub = false;
const trackT = (e) => { const r = track.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 0.9999) * TOTAL; };
track.addEventListener("pointerdown", (e) => { scrub = true; track.setPointerCapture(e.pointerId); seekTo(trackT(e), true); });
track.addEventListener("pointermove", (e) => { if (scrub) { simT = trackT(e); if (!playing) frame(simT); } });
track.addEventListener("pointerup", () => { scrub = false; AUD.resync(simT); });
track.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") { seekTo(simT + 2, true); e.preventDefault(); } if (e.key === "ArrowLeft") { seekTo(simT - 2, true); e.preventDefault(); } });
function toFree() { if (CAM.mode === "free") return; const off = CAM.lastPos.clone().sub(CAM.lastTgt); CAM.dist = off.length(); CAM.el = Math.asin(clamp(off.y / CAM.dist, -1, 1)); CAM.az = Math.atan2(off.x, off.z); CAM.mode = "free"; CAM.blend = null; }
let drag = null;
canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 4) { drag.moved = true; toFree(); }
  if (drag.moved) { CAM.az -= dx * 0.006; CAM.el = clamp(CAM.el + dy * 0.005, -1.35, 1.35); drag.x = e.clientX; drag.y = e.clientY; if (!playing) frame(simT); }
});
canvas.addEventListener("pointerup", (e) => { if (drag && !drag.moved) { const r = canvas.getBoundingClientRect(); pickAt(e.clientX - r.left, e.clientY - r.top); if (!playing) frame(simT); } drag = null; });
canvas.addEventListener("wheel", (e) => { toFree(); CAM.dist = clamp(CAM.dist * Math.exp(e.deltaY * 0.0012), 0.25, 40); e.preventDefault(); if (!playing) frame(simT); }, { passive: false });
function toAuto() { if (CAM.mode === "free") { CAM.mode = "auto"; startBlend(); } }
canvas.addEventListener("dblclick", toAuto);
addEventListener("keydown", (e) => {
  if (!started || e.target.closest?.("input, select, textarea")) return;
  if (e.target.closest?.("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "Escape") { if (!$("#drawer").hidden) toggleDrawer(false); else if (SEL) closePick(); else if (LAB.on) setLab(false); }
  else if (e.key === "r" || e.key === "R") toAuto();
  else if (e.key === "l" || e.key === "L") setLab(!LAB.on);
  else if (e.key === "i" || e.key === "I") toggleDrawer();
  else if (e.key === " ") { togglePlay(); e.preventDefault(); }
  else if (e.key === "ArrowRight" && e.target !== track) gotoChapter(Math.floor(simT / CHD) + 1);
  else if (e.key === "ArrowLeft" && e.target !== track) gotoChapter(Math.floor(simT / CHD) - (simT % CHD < 1.5 ? 1 : 0));
});
const perf = { acc: 0, n: 0, cool: 120 };
function governor(ms) {
  perf.acc += ms; perf.n++; if (perf.cool > 0) { perf.cool--; return; }
  if (perf.n < 90) return; const avg = perf.acc / perf.n; perf.acc = 0; perf.n = 0; setText($("#tFps"), fmt(1000 / avg) + " fps");
  if (avg < 23) return;
  if (Q.level === 0) { Q.level = 1; Q.samples = 8; setStageAO(curStage); }
  else if (Q.level === 1) { Q.level = 2; dpr = 1; resize(); }
  else if (Q.level === 2) { Q.level = 3; Q.gtaoOn = false; gtao.enabled = false; }
  perf.cool = 90;
}
function loop(now) {
  if (CAPTURE) return;
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (LAB.on) { LAB.t += dt; LAB.G += labState().speed * dt; }
  else if (playing && !scrub) {
    let nt = simT + dt * DUR.rate;
    if (DUR.manual) { const end = (Math.floor(simT / CHD) + 1) * CHD; if (nt >= end) { nt = end - 0.0005; playing = false; held = true; AUD.stopAll(); setPlayUI(); } }
    simT = wrapT(nt);
  }
  frame(simT); AUD.tick(simT, playing && !scrub && !LAB.on); governor(dt * 1000);
  requestAnimationFrame(loop);
}
window.SIM = {
  duration: TOTAL, chapters: CH_IDS.map((id, i) => ({ id, start: i * CHD })),
  seek(t) { if (LAB.on) setLab(false); simT = wrapT(t); CAM.blend = null; frame(simT); return { chapter: chName(stateAt(simT).ci), t: simT }; },
  state: (t) => stateAt(t), lang: (l) => setLang(l === "en" ? "en" : "tr"), mapReady: () => GEO.ready, lab: (on = true) => setLab(on),
  capture(on = true) { CAPTURE = on; $("#sim").classList.toggle("capture", on); if (!on) { lastNow = performance.now(); requestAnimationFrame(loop); } },
  play: () => setPlaying(true), pause: () => setPlaying(false), setDuration: (id) => setDur(id), pick: (x, y) => pickAt(x, y),
};

// ------------------------------------------------------------------ Açılış: harita, gölgelendiriciler, başlat
const hash = location.hash.replace("#", "");
const startCh = CH_IDS.indexOf(hash);
if (startCh >= 0) simT = startCh * CHD + 0.01;
applyStatic(); buildNav(); resize(); AUD.setRate(DUR.rate, simT);
frame(simT);
await boot("map");
try { await Promise.race([loadGeo(), new Promise((_, rej) => setTimeout(() => rej(new Error("zaman aşımı")), 12000))]); await boot("map", "done"); }
catch (e) { console.warn("Natural Earth haritası yüklenemedi; prosedürel kıtalar kullanılıyor.", e); await boot("map", "fail"); }
await boot("gpu");
try { if (renderer.compileAsync) { await renderer.compileAsync(earthScene, camera); await renderer.compileAsync(studio, camera); } } catch (e) { /* derleme ilk karede yapılır */ }
frame(STUDIO_T0 + 7); frame(simT); frame(simT);
await boot("gpu", "done");
bootReady = true;
const bS = $("#bootSound"), bQ = $("#bootSilent");
bS.disabled = bQ.disabled = false; setText(bS, L("Sesli başlat", "Start with sound"));
function start(withSound) {
  if (started) return; started = true;
  $("#boot").classList.add("out"); setTimeout(() => { $("#boot").hidden = true; }, 750);
  if (withSound) AUD.toggle(simT, true).then(setSoundUI);
  setPlaying(!RM); lastNow = performance.now();
}
bS.addEventListener("click", () => start(true));
bQ.addEventListener("click", () => start(false));
if (hash === "capture") { started = true; $("#boot").hidden = true; SIM.capture(true); frame(simT); }
else { bS.focus(); requestAnimationFrame((n) => { lastNow = n; loop(n); }); }
</script>
